<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<title>MZK</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@700;900&family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">

<style>

* { margin:0; padding:0; box-sizing:border-box; }
html, body { overflow:hidden; background:#000; }
.frame { position:relative; overflow:hidden; }
.bg {
  position:absolute; inset:0;
  width:100%; height:100%;
  object-fit:cover; object-position:center;
}
.overlay {
  position:absolute; inset:0;
  background: linear-gradient(
    to top,
    rgba(0,0,0,0.72) 0%,
    rgba(0,0,0,0.30) 38%,
    rgba(0,0,0,0.05) 62%,
    transparent 80%
  );
}
.script  { font-family:'Great Vibes', cursive; color:#fff; font-weight:400; }
.display { font-family:'Playfair Display', serif; color:#fff; font-weight:900; text-transform:uppercase; line-height:.92; }
.sub     { font-family:'Montserrat', sans-serif; color:rgba(255,255,255,0.72); font-weight:300; letter-spacing:.18em; text-transform:uppercase; }
.logo    { font-family:'Montserrat', sans-serif; color:#fff; font-weight:200; letter-spacing:.45em; text-transform:uppercase; }
.gold    { color:#C9A84C; }
.arrow   { color:#C9A84C; }

html,body { width:1080px; height:1080px; }
.frame { width:1080px; height:1080px; }
.top-logo {
  position:absolute; top:44px; left:52px;
  font-family:'Montserrat',sans-serif; font-weight:200;
  font-size:12px; letter-spacing:.45em; color:rgba(255,255,255,.75);
  text-transform:uppercase;
}
.text-block {
  position:absolute; bottom:72px; left:52px; right:52px;
}
.script-line { font-size:52px; line-height:1.1; margin-bottom:4px; }
.display-line { font-size:106px; line-height:.9; margin-bottom:22px; }
.sub-line { font-size:13px; margin-bottom:0; }
.bot-logo {
  position:absolute; bottom:40px; right:52px;
  font-family:'Montserrat',sans-serif; font-weight:200;
  font-size:11px; letter-spacing:.4em; color:rgba(255,255,255,.5);
  text-transform:uppercase;
}

</style>
</head>
<body>
<div class="frame">
  <img class="bg" src="https://images.unsplash.com/photo-1531366936337-7c912a4589a7?w=1080&h=1080&fit=crop&q=95" alt=""/>
  <div class="overlay"></div>
  <div class="top-logo">MZK Swiss Group</div>
  <div class="text-block">
    <p class="script script-line">Vivez</p>
    <h1 class="display display-line">Saint-Moritz <span class="arrow">→</span></h1>
    <p class="sub sub-line">Winter Experience · Hébergement · Transferts · Restaurants</p>
  </div>
  <div class="bot-logo">mzkswissgroup.ch</div>
</div>
</body>
</html>
