<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=1080"/>
  <title>MZK Swiss Group — Story</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
  
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      width:1080px; height:1920px;
      overflow:hidden; background:#000;
      font-family:'Cormorant Garamond', Georgia, serif;
    }
    .frame {
      width:1080px; height:1920px;
      position:relative; overflow:hidden;
    }
    .bg {
      position:absolute; inset:0;
      width:100%; height:100%;
      object-fit:cover; object-position:center;
    }
    .overlay {
      position:absolute; inset:0;
      background:linear-gradient(
        160deg,
        rgba(5,18,45,0.75) 0%,
        rgba(2,8,20,0.60) 40%,
        rgba(10,25,55,0.80) 100%
      );
    }
    .gold-line { background:#C9A84C; }
    .gold { color:#C9A84C; }
    .white { color:#FFFFFF; }
    .cream { color:#EDE8DF; }
    .caps {
      font-family:'Montserrat', sans-serif;
      letter-spacing:.22em; text-transform:uppercase; font-weight:400;
    }
    .logo-wrap {
      display:flex; align-items:center; gap:12px;
    }
    .diamond {
      width:28px; height:28px;
      border:1.5px solid #C9A84C;
      transform:rotate(45deg);
      display:flex; align-items:center; justify-content:center;
    }
    .diamond-inner {
      width:14px; height:14px;
      background:#C9A84C;
      transform:rotate(0deg);
    }
    .border-frame {
      position:absolute;
      border:1px solid rgba(201,168,76,0.35);
    }

  .content {
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    padding:80px 64px;
  }
  
  </style>
</head>
<body>
<div class="frame">
  <img class="bg" src="https://images.unsplash.com/photo-1566073771259-6a8506099945?w=1080&h=1920&fit=crop&q=90" alt=""/>
  <div class="overlay" style="background:linear-gradient(180deg,rgba(5,18,45,0.7) 0%,rgba(2,8,20,0.45) 50%,rgba(5,18,45,0.85) 100%);"></div>
  <div class="border-frame" style="inset:28px;"></div>
  <div class="content">
  <div class="logo-wrap">
    <div class="diamond"><div class="diamond-inner"></div></div>
    <span class="caps gold" style="font-size:14px; letter-spacing:.3em;">MZK Swiss Group</span>
  </div>

  <div style="flex:1; display:flex; flex-direction:column; justify-content:flex-end; padding-bottom:60px; gap:20px;">
    <p class="caps gold" style="font-size:11px; opacity:.65; letter-spacing:.3em;">🏨  HÔTELS D'EXCEPTION</p>
    <h1 class="white" style="font-size:84px; font-weight:300; line-height:1.05;">
      La suite que<br/>
      <span style="font-style:italic; color:#C9A84C;">vous méritez.</span>
    </h1>
    <div style="width:50px; height:1px; margin:12px 0;" class="gold-line"></div>
    <p class="cream" style="font-size:21px; font-weight:300; opacity:.72; line-height:1.75;">
      Suites présidentielles<br/>
      Chalets privés · Palaces<br/>
      Genève · Saint-Moritz · Dubaï<br/>Paris · New York · Tokyo
    </p>
  </div>

  <div style="padding:28px 0; border-top:1px solid rgba(201,168,76,0.35); text-align:center;">
    <div style="border:1px solid rgba(201,168,76,0.6); padding:16px 48px; display:inline-block;">
      <p class="caps gold" style="font-size:13px; letter-spacing:.25em;">Réserver →</p>
    </div>
    <p class="caps cream" style="font-size:10px; opacity:.4; letter-spacing:.2em; margin-top:16px;">mzkswissgroup.ch</p>
  </div>
</div>
</div>
</body>
</html>
