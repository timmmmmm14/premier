  <line x1="90" y1="300" x2="90" y2="780" stroke="#C9A84C" stroke-width="1.5" opacity="0.5"/>
  <text x="130" y="360" font-family="Georgia,serif" font-size="18" fill="#C9A84C" letter-spacing="5" opacity="0.7">JETS PRIVÉS</text>
  <text x="128" y="460" font-family="Georgia,serif" font-size="68" fill="#F5F0EB" opacity="0.95">Votre</text>
  <text x="128" y="550" font-family="Georgia,serif" font-size="68" fill="#F5F0EB" opacity="0.95">destination.</text>
  <text x="128" y="640" font-family="Georgia,serif" font-size="68" fill="#C9A84C">Vos</text>
  <text x="128" y="730" font-family="Georgia,serif" font-size="68" fill="#C9A84C">conditions.</text>
  <text x="130" y="830" font-family="Georgia,serif" font-size="20" fill="#F5F0EB" opacity="0.55">De Genève à n'importe où dans le monde.</text>
  <text x="130" y="862" font-family="Georgia,serif" font-size="20" fill="#F5F0EB" opacity="0.55">24h/7j · Charter & jets long-courriers.</text>
