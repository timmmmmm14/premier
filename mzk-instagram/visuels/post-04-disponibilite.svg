<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  
  <rect width="1080" height="1080" fill="#0A0A0A"/>
  <rect x="40" y="40" width="1000" height="1000" fill="none" stroke="#C9A84C" stroke-width="0.8" opacity="0.35"/>
  <!-- Large time display -->
  <text x="540" y="280" text-anchor="middle" font-family="Georgia,serif" font-size="22"
        fill="#C9A84C" letter-spacing="8" opacity="0.6">IL EST</text>
  <text x="540" y="430" text-anchor="middle" font-family="Georgia,serif" font-size="170" font-weight="bold"
        fill="#F5F0EB" letter-spacing="-5" opacity="0.95">02:37</text>
  <line x1="120" y1="460" x2="960" y2="460" stroke="#C9A84C" stroke-width="0.8" opacity="0.3"/>
  <!-- Message -->
  <text x="540" y="560" text-anchor="middle" font-family="Georgia,serif" font-size="42" fill="#F5F0EB">Vous avez besoin d'un jet.</text>
  <text x="540" y="620" text-anchor="middle" font-family="Georgia,serif" font-size="42" fill="#F5F0EB">Pour New York. Dans 4 heures.</text>
  <line x1="340" y1="660" x2="740" y2="660" stroke="#C9A84C" stroke-width="1" opacity="0.5"/>
  <text x="540" y="730" text-anchor="middle" font-family="Georgia,serif" font-size="54"
        fill="#C9A84C" font-style="italic">Nous décrachons.</text>
  <line x1="340" y1="768" x2="740" y2="768" stroke="#C9A84C" stroke-width="1" opacity="0.5"/>
  <!-- 24h badge -->
  <rect x="370" y="820" width="340" height="80" rx="4" fill="none" stroke="#C9A84C" stroke-width="1.5" opacity="0.6"/>
  <text x="540" y="870" text-anchor="middle" font-family="Georgia,serif" font-size="30"
        fill="#C9A84C" letter-spacing="8">24H / 7J / 365J</text>
  <text x="540" y="975" text-anchor="middle" font-family="Georgia,serif" font-size="18"
        fill="#F5F0EB" letter-spacing="4" opacity="0.5">MZK SWISS GROUP</text>

</svg>