<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=1080"/>
  <title>Highlight — Montres</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:1080px; height:1080px; overflow:hidden; background:#000; font-family:'Cormorant Garamond', serif; }
    .frame { width:1080px; height:1080px; position:relative; overflow:hidden; }
    .bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .overlay { position:absolute; inset:0; background:linear-gradient(180deg,rgba(10,5,2,0.55) 0%,rgba(20,10,2,0.85) 100%); }
    .border-frame { position:absolute; border:1px solid rgba(201,168,76,0.4); }
    .gold { color:#C9A84C; }
    .white { color:#fff; }
    .caps { font-family:'Montserrat',sans-serif; letter-spacing:.22em; text-transform:uppercase; font-weight:400; }
    .gold-line { background:#C9A84C; }
    .content { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding:0 64px 80px; text-align:center; }
    .icon { font-size:96px; margin-bottom:32px; }
  </style>
</head>
<body>
<div class="frame">
  <img class="bg" src="https://images.unsplash.com/photo-1523170335258-f5ed11844a49?w=1080&h=1080&fit=crop&q=90" alt=""/>
  <div class="overlay"></div>
  <div class="border-frame" style="inset:30px;"></div>
  <div class="content">
    <div class="icon">⌚</div>
    <div style="width:50px;height:1px;margin:0 auto 28px;" class="gold-line"></div>
    <h1 class="white" style="font-size:72px;font-weight:300;line-height:1.05;margin-bottom:16px;">
      Horlogerie<br/>de Prestige
    </h1>
    <p class="caps gold" style="font-size:12px;opacity:.8;letter-spacing:.3em;">MZK Swiss Group</p>
  </div>
</div>
</body>
</html>
