<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=1080"/>
  <title>Highlight — Founder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:1080px; height:1080px; overflow:hidden; background:#000; font-family:'Cormorant Garamond', serif; }
    .frame { width:1080px; height:1080px; position:relative; overflow:hidden; background:#0A0A0A; }
    .border-frame { position:absolute; border:1px solid rgba(201,168,76,0.4); }
    .gold { color:#C9A84C; }
    .white { color:#fff; }
    .caps { font-family:'Montserrat',sans-serif; letter-spacing:.22em; text-transform:uppercase; font-weight:400; }
    .gold-line { background:#C9A84C; }
    .content { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding:0 64px 80px; text-align:center; }
    /* Monogram circle */
    .monogram {
      width:200px; height:200px;
      border:2px solid #C9A84C;
      border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      margin-bottom:40px;
    }
    .mono-letter { font-size:110px; font-weight:300; color:#C9A84C; line-height:1; }
  </style>
</head>
<body>
<div class="frame">
  <div class="border-frame" style="inset:30px;"></div>
  <!-- subtle diagonal lines decor -->
  <svg style="position:absolute;inset:0;width:100%;height:100%;opacity:.04" viewBox="0 0 1080 1080" preserveAspectRatio="none">
    <line x1="0" y1="200" x2="1080" y2="1280" stroke="#C9A84C" stroke-width="1"/>
    <line x1="0" y1="400" x2="1080" y2="1480" stroke="#C9A84C" stroke-width="1"/>
    <line x1="0" y1="600" x2="1080" y2="1680" stroke="#C9A84C" stroke-width="1"/>
  </svg>
  <div class="content">
    <div class="monogram">
      <span class="mono-letter">M</span>
    </div>
    <div style="width:50px;height:1px;margin:0 auto 28px;" class="gold-line"></div>
    <h1 class="white" style="font-size:64px;font-weight:300;line-height:1.1;margin-bottom:12px;">
      Malik<br/>Zouaimia
    </h1>
    <p class="caps gold" style="font-size:11px;opacity:.8;letter-spacing:.3em;margin-bottom:8px;">Founder</p>
    <p class="caps gold" style="font-size:11px;opacity:.5;letter-spacing:.2em;">MZK Swiss Group</p>
  </div>
</div>
</body>
</html>
