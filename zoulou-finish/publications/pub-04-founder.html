<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=1080"/>
  <title>Post — Founder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:1080px; height:1080px; overflow:hidden; background:#0A0A0A; font-family:'Cormorant Garamond', serif; }
    .frame { width:1080px; height:1080px; position:relative; overflow:hidden; background:#0A0A0A; }
    .border-frame { position:absolute; border:1px solid rgba(201,168,76,0.35); }
    .gold { color:#C9A84C; } .white { color:#fff; } .cream { color:#EDE8DF; }
    .caps { font-family:'Montserrat',sans-serif; letter-spacing:.22em; text-transform:uppercase; font-weight:400; }
    .gold-line { background:#C9A84C; }
    .content { position:absolute; inset:0; display:flex; flex-direction:column; padding:64px; }
    .logo-wrap { display:flex; align-items:center; gap:12px; }
    .diamond { width:28px; height:28px; border:1.5px solid #C9A84C; transform:rotate(45deg); display:flex; align-items:center; justify-content:center; }
    .diamond-inner { width:14px; height:14px; background:#C9A84C; }
    .mono-circle { width:220px; height:220px; border-radius:50%; border:2px solid #C9A84C; display:flex; align-items:center; justify-content:center; background:rgba(201,168,76,0.04); }
  </style>
</head>
<body>
<div class="frame">
  <svg style="position:absolute;inset:0;width:100%;height:100%;opacity:.04" viewBox="0 0 1080 1080">
    <circle cx="540" cy="540" r="480" stroke="#C9A84C" stroke-width="1" fill="none"/>
    <circle cx="540" cy="540" r="360" stroke="#C9A84C" stroke-width="1" fill="none"/>
  </svg>
  <div class="border-frame" style="inset:32px;"></div>
  <div class="border-frame" style="inset:40px;border-color:rgba(201,168,76,0.12);"></div>
  <div class="content">
    <div class="logo-wrap">
      <div class="diamond"><div class="diamond-inner"></div></div>
      <span class="caps gold" style="font-size:13px;letter-spacing:.3em;">MZK Swiss Group</span>
    </div>
    <div style="flex:1;display:flex;align-items:center;gap:60px;">
      <div class="mono-circle">
        <span style="font-size:110px;font-weight:300;color:#C9A84C;line-height:1;">MZ</span>
      </div>
      <div>
        <p class="caps gold" style="font-size:10px;opacity:.7;letter-spacing:.3em;margin-bottom:20px;">— Founder & CEO</p>
        <h1 class="white" style="font-size:68px;font-weight:300;line-height:1.1;margin-bottom:16px;">
          Malik<br/>Zouaimia
        </h1>
        <div style="width:50px;height:1px;margin-bottom:22px;" class="gold-line"></div>
        <p class="cream" style="font-size:22px;font-weight:300;opacity:.7;line-height:1.65;">
          Fondateur de MZK Swiss Group.<br/>
          Basé à Genève 🇨🇭,<br/>
          opérations mondiales.
        </p>
        <p class="caps gold" style="font-size:10px;opacity:.5;margin-top:20px;letter-spacing:.2em;">Discrétion · Précision · Excellence</p>
      </div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding-top:24px;border-top:1px solid rgba(201,168,76,0.3);">
      <p class="caps gold" style="font-size:10px;opacity:.6;letter-spacing:.2em;">mzkswissgroup.ch</p>
      <p class="caps cream" style="font-size:10px;opacity:.35;">CONCIERGERIE PRIVÉE D'EXCEPTION</p>
    </div>
  </div>
</div>
</body>
</html>
