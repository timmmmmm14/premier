<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=1080"/>
  <title>Story — Basé à Genève</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:1080px; height:1920px; overflow:hidden; background:#000; font-family:'Cormorant Garamond', serif; }
    .frame { width:1080px; height:1920px; position:relative; overflow:hidden; }
    .bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .overlay { position:absolute; inset:0; background:linear-gradient(180deg,rgba(2,8,20,0.60) 0%,rgba(2,8,20,0.30) 50%,rgba(5,18,45,0.90) 100%); }
    .border-frame { position:absolute; border:1px solid rgba(201,168,76,0.35); }
    .gold { color:#C9A84C; }
    .white { color:#fff; }
    .cream { color:#EDE8DF; }
    .caps { font-family:'Montserrat',sans-serif; letter-spacing:.22em; text-transform:uppercase; font-weight:400; }
    .gold-line { background:#C9A84C; }
    .content { position:absolute; inset:0; display:flex; flex-direction:column; padding:80px 64px; }
    .logo-wrap { display:flex; align-items:center; gap:12px; }
    .diamond { width:28px; height:28px; border:1.5px solid #C9A84C; transform:rotate(45deg); display:flex; align-items:center; justify-content:center; }
    .diamond-inner { width:14px; height:14px; background:#C9A84C; }
    .city-tag { display:flex; align-items:center; gap:18px; margin-bottom:28px; }
    .city-dot { width:10px; height:10px; border-radius:50%; background:#C9A84C; }
    .city-name { font-size:32px; font-weight:300; color:#EDE8DF; opacity:.8; }
    .city-name.main { font-size:36px; color:#C9A84C; opacity:1; }
  </style>
</head>
<body>
<div class="frame">
  <img class="bg" src="https://images.unsplash.com/photo-1601785776975-b7e08c1b65a3?w=1080&h=1920&fit=crop&q=90" alt=""/>
  <div class="overlay"></div>
  <div class="border-frame" style="inset:28px;"></div>

  <div class="content">
    <div class="logo-wrap">
      <div class="diamond"><div class="diamond-inner"></div></div>
      <span class="caps gold" style="font-size:14px;letter-spacing:.3em;">MZK Swiss Group</span>
    </div>

    <div style="flex:1; display:flex; flex-direction:column; justify-content:center;">

      <p class="caps gold" style="font-size:11px;opacity:.7;letter-spacing:.3em;margin-bottom:24px;">— Notre base</p>
      <h1 class="white" style="font-size:100px;font-weight:300;line-height:1.0;margin-bottom:8px;">
        Genève.
      </h1>
      <h2 style="font-size:60px;font-weight:300;font-style:italic;color:#C9A84C;line-height:1.0;margin-bottom:36px;">
        Présents partout.
      </h2>
      <div style="width:50px;height:1px;margin-bottom:48px;" class="gold-line"></div>

      <p class="cream" style="font-size:28px;font-weight:300;opacity:.7;line-height:1.7;margin-bottom:56px;">
        Fondés au cœur de la Suisse, là où la discrétion et l'excellence sont un standard — pas une promesse.
      </p>

      <!-- Cities -->
      <div>
        <div class="city-tag"><div class="city-dot"></div><span class="city-name main">Genève — Siège</span></div>
        <div class="city-tag"><div class="city-dot" style="opacity:.6"></div><span class="city-name">Zurich</span></div>
        <div class="city-tag"><div class="city-dot" style="opacity:.6"></div><span class="city-name">Dubai</span></div>
        <div class="city-tag"><div class="city-dot" style="opacity:.6"></div><span class="city-name">Paris · Monaco</span></div>
        <div class="city-tag"><div class="city-dot" style="opacity:.6"></div><span class="city-name">New York · Londres</span></div>
        <div class="city-tag"><div class="city-dot" style="opacity:.4"></div><span class="city-name" style="opacity:.5;">+ Destinations mondiales</span></div>
      </div>

    </div>

    <div style="text-align:center; padding-top:32px; border-top:1px solid rgba(201,168,76,0.3);">
      <p class="caps gold" style="font-size:13px;letter-spacing:.25em;margin-bottom:14px;opacity:.85;">🇨🇭 Swiss Quality — Global Reach</p>
      <p class="caps cream" style="font-size:11px;opacity:.4;letter-spacing:.2em;">mzkswissgroup.ch</p>
    </div>
  </div>
</div>
</body>
</html>
