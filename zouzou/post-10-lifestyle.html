<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<title>MZK — c'est vous</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@700;900&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">

<style>

* { margin:0; padding:0; box-sizing:border-box; }
html { background:#111; }
body { overflow:hidden; background:#111; }
#frame { position:relative; overflow:hidden; background:#000; }
.bg {
  position:absolute; inset:0;
  width:100%; height:100%;
  object-fit:cover; object-position:center;
}
.overlay {
  position:absolute; inset:0;
  background: linear-gradient(to top,
    rgba(0,0,0,.75) 0%,
    rgba(0,0,0,.28) 38%,
    rgba(0,0,0,.04) 62%,
    transparent 80%);
}
.script  { font-family:'Great Vibes',cursive; color:#fff; }
.display { font-family:'Playfair Display',serif; color:#fff; font-weight:900; text-transform:uppercase; line-height:.9; }
.sub     { font-family:'Montserrat',sans-serif; color:rgba(255,255,255,.68); font-weight:300; letter-spacing:.18em; text-transform:uppercase; }
.logo    { font-family:'Montserrat',sans-serif; font-weight:200; letter-spacing:.42em; text-transform:uppercase; }
.gold    { color:#C9A84C; }

#frame { width:1080px; height:1080px; }
.top  { position:absolute; top:44px; left:52px; }
.body { position:absolute; bottom:68px; left:52px; right:52px; }
.bot  { position:absolute; bottom:36px; right:52px; }
</style>
<script>var W=1080,H=1080;</script>

<script>
function scale() {
  var s = Math.min(window.innerWidth / W, window.innerHeight / H);
  var f = document.getElementById('frame');
  f.style.transform = 'scale(' + s + ')';
  f.style.transformOrigin = 'top left';
  document.body.style.width  = Math.round(W * s) + 'px';
  document.body.style.height = Math.round(H * s) + 'px';
}
window.addEventListener('load',   scale);
window.addEventListener('resize', scale);
</script>

</head>
<body>
<div id="frame">
  <img class="bg" src="https://images.unsplash.com/photo-1510812431401-41d2bd2722f3?w=1080&h=1080&fit=crop&q=95" alt=""/>
  <div class="overlay"></div>

  <div class="top">
    <p class="logo" style="font-size:11px;color:rgba(255,255,255,.7);">MZK Swiss Group</p>
  </div>

  <div class="body">
    <p class="script" style="font-size:52px;line-height:1.15;margin-bottom:2px;">Le vrai luxe</p>
    <h1 class="display" style="font-size:104px;margin-bottom:20px;">
      c'est vous <span class="gold">→</span>
    </h1>
    <p class="sub" style="font-size:12px;">Chaque détail compte · Chaque client est unique</p>
  </div>

  <div class="bot">
    <p class="logo" style="font-size:10px;color:rgba(255,255,255,.42);">mzkswissgroup.ch</p>
  </div>
</div>
</body>
</html>
